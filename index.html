<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Ponto - Grupo Vilela de Queiroz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --gvq-blue: #070928;
            --gvq-green: #00873e;
            --gvq-green-light: #00a84f;
        }
        .bg-gvq-dark { background-color: #0b0f29; }
        .bg-gvq-card { background-color: #13183f; }
        .border-gvq { border-color: #212b63; }
    </style>
</head>
<body class="bg-gvq-dark text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho com Logo -->
    <header class="p-4 text-center bg-gvq-card shadow-md border-b border-gvq flex flex-col items-center justify-center space-y-2">
        <img src="logo.png" alt="Grupo Vilela de Queiroz" class="h-10 object-contain">
        <div>
            <h1 class="text-lg font-bold tracking-wide">Controle de Ponto</h1>
            <p id="current-date" class="text-xs text-slate-400"></p>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full flex flex-col justify-center items-center space-y-6">

        <!-- Relógio em tempo real -->
        <div class="text-center">
            <span id="live-clock" class="text-4xl font-mono font-semibold tracking-wider text-emerald-400">00:00:00</span>
        </div>

        <!-- Botão Principal de Bater Ponto -->
        <div class="w-full flex flex-col items-center">
            <button onclick="abrirModalBaterPonto()" class="w-48 h-48 rounded-full bg-[#00873e] hover:bg-[#00a84f] active:scale-95 transition shadow-lg shadow-emerald-950/50 flex flex-col items-center justify-center border-4 border-emerald-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-2 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-lg font-bold text-white">BATER PONTO</span>
            </button>
            <p id="proximo-tipo" class="mt-3 text-sm text-slate-300 text-center font-medium">Carregando...</p>
        </div>

        <!-- Resumo do Banco de Horas -->
        <div class="w-full bg-gvq-card p-4 rounded-xl shadow border border-gvq flex justify-between items-center">
            <div>
                <p class="text-xs text-slate-400 uppercase font-semibold">Saldo Atual</p>
                <p id="saldo-banco" class="text-xl font-bold font-mono">00:00</p>
            </div>
            <button onclick="abrirModalManual()" class="bg-[#1f2863] hover:bg-[#28337a] text-white px-3 py-2 rounded-lg text-sm transition font-medium">
                + Adicionar Manual
            </button>
        </div>

        <!-- Histórico Recente -->
        <div class="w-full bg-gvq-card p-4 rounded-xl shadow border border-gvq">
            <h2 class="text-sm font-semibold text-slate-400 mb-3 uppercase">Últimos Registros</h2>
            <div id="lista-registros" class="space-y-2 max-h-48 overflow-y-auto pr-1 text-sm">
                <p class="text-slate-500 text-center py-2">Carregando registros...</p>
            </div>
        </div>

    </main>

    <!-- Modal de Confirmação / Registro -->
    <div id="modal-ponto" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gvq-card p-6 rounded-2xl w-full max-w-sm border border-gvq shadow-xl space-y-4">
            <h3 id="modal-titulo" class="text-lg font-bold">Confirmar Ponto</h3>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Horário</label>
                <input type="time" id="input-horario" class="w-full bg-gvq-dark border border-gvq rounded-lg p-3 text-center font-mono text-xl text-white">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Tipo de Batida</label>
                <select id="select-tipo" class="w-full bg-gvq-dark border border-gvq rounded-lg p-3 text-white">
                    <option value="Entrada">Entrada (Manhã)</option>
                    <option value="Saída Almoço">Saída Almoço</option>
                    <option value="Retorno Almoço">Retorno Almoço</option>
                    <option value="Saída">Saída (Fim do dia)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Data</label>
                <input type="date" id="input-data" class="w-full bg-gvq-dark border border-gvq rounded-lg p-3 text-white">
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="fecharModais()" class="flex-1 bg-slate-700 hover:bg-slate-600 p-3 rounded-lg font-medium transition">Cancelar</button>
                <button onclick="salvarPonto()" class="flex-1 bg-[#00873e] hover:bg-[#00a84f] text-white p-3 rounded-lg font-medium transition">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="p-4 text-center text-xs text-slate-500 border-t border-gvq/50">
        Grupo Vilela de Queiroz &copy; 2026
    </footer>

    <!-- SDKs do Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBm6j9bzrYjqaHEeUufUx_OoCvrRhGX-cw",
            authDomain: "banco-de-horas-11521.firebaseapp.com",
            projectId: "banco-de-horas-11521",
            storageBucket: "banco-de-horas-11521.firebasestorage.app",
            messagingSenderId: "608750621397",
            appId: "1:608750621397:web:a433e48050569e7810085c",
            measurementId: "G-QEN9JMNWLJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const JORNADA_DIARIA = 480; // 8 horas líquidas em minutos
        let registros = [];

        // Relógio ao vivo e data atual
        setInterval(() => {
            const agora = new Date();
            document.getElementById('live-clock').innerText = agora.toLocaleTimeString('pt-BR');
        }, 1000);

        const hojeStr = new Date().toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        document.getElementById('current-date').innerText = hojeStr;

        function formatarDataISO(data) {
            return data.toISOString().split('T')[0];
        }

        async function carregarRegistros() {
            try {
                const q = query(collection(db, "registros"), orderBy("data", "desc"), orderBy("horario", "desc"));
                const querySnapshot = await getDocs(q);
                
                registros = [];
                querySnapshot.forEach((docSnap) => {
                    registros.push({
                        idDoc: docSnap.id,
                        ...docSnap.data()
                    });
                });
                
                atualizarTela();
            } catch (error) {
                console.error("Erro ao carregar do Firebase:", error);
                document.getElementById('lista-registros').innerHTML = '<p class="text-rose-400 text-center py-2">Erro ao conectar com a nuvem.</p>';
            }
        }

        function atualizarProximoTipo() {
            const hoje = formatarDataISO(new Date());
            const registrosHoje = registros.filter(r => r.data === hoje).sort((a, b) => a.horario.localeCompare(b.horario));
            
            const tipos = ['Entrada', 'Saída Almoço', 'Retorno Almoço', 'Saída'];
            const proximo = tipos[registrosHoje.length] || 'Todas as batidas de hoje concluídas';
            document.getElementById('proximo-tipo').innerText = registrosHoje.length < 4 ? `Próxima batida sugerida: ${proximo}` : 'Dia concluído!';
        }

        window.abrirModalBaterPonto = function() {
            const agora = new Date();
            const horaAtual = agora.toTimeString().slice(0, 5);
            
            document.getElementById('input-horario').value = horaAtual;
            document.getElementById('input-data').value = formatarDataISO(agora);
            
            const hoje = formatarDataISO(agora);
            const registrosHoje = registros.filter(r => r.data === hoje).length;
            const tipos = ['Entrada', 'Saída Almoço', 'Retorno Almoço', 'Saída'];
            document.getElementById('select-tipo').value = tipos[registrosHoje] || 'Entrada';
            
            document.getElementById('modal-titulo').innerText = 'Registrar Ponto';
            document.getElementById('modal-ponto').classList.remove('hidden');
        }

        window.abrirModalManual = function() {
            const agora = new Date();
            document.getElementById('input-horario').value = agora.toTimeString().slice(0, 5);
            document.getElementById('input-data').value = formatarDataISO(agora);
            document.getElementById('select-tipo').value = 'Entrada';
            
            document.getElementById('modal-titulo').innerText = 'Adicionar Ponto Manual';
            document.getElementById('modal-ponto').classList.remove('hidden');
        }

        window.fecharModais = function() {
            document.getElementById('modal-ponto').classList.add('hidden');
        }

        window.salvarPonto = async function() {
            const horario = document.getElementById('input-horario').value;
            const tipo = document.getElementById('select-tipo').value;
            const data = document.getElementById('input-data').value;

            if (!horario || !data) {
                alert('Preencha todos os campos!');
                return;
            }

            try {
                await addDoc(collection(db, "registros"), { data, horario, tipo });
                fecharModais();
                carregarRegistros();
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert('Erro ao salvar dados na nuvem.');
            }
        }

        window.excluirRegistro = async function(idDoc) {
            if (confirm('Deseja realmente excluir este registro?')) {
                try {
                    await deleteDoc(doc(db, "registros", idDoc));
                    carregarRegistros();
                } catch (error) {
                    console.error("Erro ao excluir:", error);
                    alert('Erro ao excluir registro.');
                }
            }
        }

        function converterHoraMinutos(horaStr) {
            const [h, m] = horaStr.split(':').map(Number);
            return h * 60 + m;
        }

        function formatarMinutosHoras(totalMinutos) {
            const sinal = totalMinutos < 0 ? '-' : '';
            const minAbs = Math.abs(totalMinutos);
            const h = Math.floor(minAbs / 60).toString().padStart(2, '0');
            const m = (minAbs % 60).toString().padStart(2, '0');
            return `${sinal}${h}:${m}`;
        }

        function calcularBancoHoras() {
            const dias = {};
            registros.forEach(r => {
                if (!dias[r.data]) dias[r.data] = [];
                dias[r.data].push(r);
            });

            let saldoTotalMinutos = 0;

            for (const data in dias) {
                const [ano, mes, dia] = data.split('-').map(Number);
                const dataObj = new Date(ano, mes - 1, dia);
                const diaSemana = dataObj.getDay(); 

                if (diaSemana === 0 || diaSemana === 6) continue; // Ignorar fins de semana

                const batidas = dias[data].sort((a, b) => a.horario.localeCompare(b.horario));
                
                if (batidas.length >= 2) {
                    let minutosTrab = 0;
                    
                    if (batidas.length >= 4) {
                        const p1 = converterHoraMinutos(batidas[0].horario);
                        const p2 = converterHoraMinutos(batidas[1].horario);
                        const p3 = converterHoraMinutos(batidas[2].horario);
                        const p4 = converterHoraMinutos(batidas[3].horario);
                        minutosTrab = (p2 - p1) + (p4 - p3);
                    } else if (batidas.length === 2) {
                        const p1 = converterHoraMinutos(batidas[0].horario);
                        const p2 = converterHoraMinutos(batidas[1].horario);
                        minutosTrab = p2 - p1;
                    }

                    const saldoDia = minutosTrab - JORNADA_DIARIA;
                    saldoTotalMinutos += saldoDia;
                }
            }

            const elSaldo = document.getElementById('saldo-banco');
            elSaldo.innerText = formatarMinutosHoras(saldoTotalMinutos);
            if (saldoTotalMinutos < 0) {
                elSaldo.className = "text-xl font-bold font-mono text-rose-400";
            } else if (saldoTotalMinutos > 0) {
                elSaldo.className = "text-xl font-bold font-mono text-emerald-400";
            } else {
                elSaldo.className = "text-xl font-bold font-mono text-slate-100";
            }
        }

        function renderizarLista() {
            const listaEl = document.getElementById('lista-registros');
            listaEl.innerHTML = '';

            const ultimos = [...registros].slice(0, 10);

            if (ultimos.length === 0) {
                listaEl.innerHTML = '<p class="text-slate-500 text-center py-2">Nenhum registro encontrado.</p>';
                return;
            }

            ultimos.forEach(r => {
                const [ano, mes, dia] = r.data.split('-');
                const dataFormatada = `${dia}/${mes}/${ano}`;
                
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gvq-dark p-2 rounded-lg border border-gvq/50";
                div.innerHTML = `
                    <div>
                        <span class="font-mono font-bold text-emerald-400">${r.horario}</span>
                        <span class="text-xs text-slate-400 ml-2">(${r.tipo})</span>
                        <div class="text-xs text-slate-500">${dataFormatada}</div>
                    </div>
                    <button onclick="excluirRegistro('${r.idDoc}')" class="text-rose-400 hover:text-rose-300 p-1 text-xs">Excluir</button>
                `;
                listaEl.appendChild(div);
            });
        }

        function atualizarTela() {
            renderizarLista();
            calcularBancoHoras();
            atualizarProximoTipo();
        }

        carregarRegistros();
    </script>
</body>
</html>
